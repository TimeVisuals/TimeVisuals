<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TimeVisuals — Скачать</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Unbounded:wght@600;800;900&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #0a0a0f;
    --surface: #14141d;
    --accent: #8b5cf6;
    --accent-glow: rgba(139, 92, 246, 0.4);
    --text: #ffffff;
    --text-muted: #9ca3af;
    --border: rgba(255,255,255,0.06);
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ФОН */
  .bg-glows { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .glow-1 { position: absolute; width: 60vw; height: 60vw; border-radius: 50%; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 60%); top: -10%; left: -10%; filter: blur(60px); animation: float 10s infinite alternate; }
  .glow-2 { position: absolute; width: 50vw; height: 50vw; border-radius: 50%; background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 60%); bottom: -10%; right: -10%; filter: blur(60px); animation: float 12s infinite alternate-reverse; }
  @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 30px); } }

  /* ШАПКА */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 6%; background: rgba(10, 10, 15, 0.7);
    backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
  }
  
  .logo { font-family: 'Unbounded', sans-serif; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
  .logo span { color: var(--accent); }

  /* КОНТЕНТ */
  .page-content { margin-top: 100px; flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
  
  .download-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
    padding: 40px 30px; text-align: center; max-width: 400px; width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; overflow: hidden;
  }
  .download-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  
  .download-icon { font-size: 4rem; margin-bottom: 20px; filter: drop-shadow(0 0 15px var(--accent-glow)); }
  .download-card h2 { font-family: 'Unbounded', sans-serif; font-size: 1.8rem; margin-bottom: 10px; }
  .download-card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 30px; }
  
  .file-name { 
    background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; 
    font-family: monospace; font-size: 0.9rem; color: var(--accent);
    margin-bottom: 30px; display: block; border: 1px solid var(--border);
  }

  /* КНОПКА СКАЧИВАНИЯ */
  .btn-download {
    display: flex; justify-content: center; align-items: center; gap: 10px;
    width: 100%; background: var(--accent); color: #fff; text-decoration: none;
    padding: 18px; border-radius: 14px; font-weight: 700; font-size: 1.1rem;
    transition: 0.3s; box-shadow: 0 8px 25px var(--accent-glow);
  }
  .btn-download:hover { background: #7c3aed; transform: translateY(-3px); box-shadow: 0 12px 35px var(--accent-glow); }
  .btn-download svg { width: 22px; height: 22px; fill: currentColor; }

</style>
</head>
<body>

  <div class="bg-glows">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
  </div>

  <header>
    <div class="logo">TIME<span>VISUALS</span></div>
  </header>

  <main class="page-content">
    
    <div class="download-card">
      <div class="download-icon">📦</div>
      <h2>Визуалы готовы</h2>
      <p>Скачай архив с нашими визуалами и распакуй его в папку с игрой.</p>
      
      <span class="file-name">TimeVisual (61).zip</span>
      
      <!-- Ссылка на скачивание твоего файла с GitHub -->
      <a href="TimeVisual (61).zip" download class="btn-download">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Скачать архив
      </a>
    </div>

  </main>

</body>
</html>
